<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rise Circle — Analytics</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
<div class="app-shell">
  <div id="sidebarMount"></div>
  <main class="main-content">
    <div class="page-header">
      <h1 class="page-title">Analytics 📊</h1>
      <p class="page-subtitle">Understand your productivity patterns</p>
    </div>

    <!-- Summary Stats -->
    <div class="grid-4 section">
      <div class="stat-card">
        <div class="stat-value stat-accent" id="prodScore">—</div>
        <div class="stat-label">Productivity Score</div>
      </div>
      <div class="stat-card">
        <div class="stat-value stat-green" id="totalTasksDone">—</div>
        <div class="stat-label">Total Tasks Completed</div>
      </div>
      <div class="stat-card">
        <div class="stat-value stat-blue" id="currentStreak">—</div>
        <div class="stat-label">Current Streak 🔥</div>
      </div>
      <div class="stat-card">
        <div class="stat-value stat-purple" id="focusHoursTotal">—</div>
        <div class="stat-label">Focus Hours (7d)</div>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px">

      <!-- Task Completion Chart -->
      <div class="card">
        <div class="card-title">Task Completion (30 days)</div>
        <canvas id="taskChart" height="200"></canvas>
        <div id="taskChartFallback" style="display:none">
          <div id="taskBars" style="display:flex;align-items:flex-end;gap:3px;height:140px;margin-top:12px"></div>
          <div id="taskLabels" style="display:flex;gap:3px;margin-top:4px"></div>
        </div>
      </div>

      <!-- Focus Chart -->
      <div class="card">
        <div class="card-title">Focus Minutes (7 days)</div>
        <div id="focusBars" style="display:flex;align-items:flex-end;gap:8px;height:140px;margin-top:12px"></div>
        <div id="focusLabels" style="display:flex;gap:8px;margin-top:8px"></div>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px">

      <!-- Wake Time History -->
      <div class="card">
        <div class="card-title">Wake Record (14 days)</div>
        <div id="wakeTimeline" style="display:flex;flex-direction:column;gap:6px;margin-top:4px"></div>
      </div>

      <!-- Insights -->
      <div class="card">
        <div class="card-title">Insights 💡</div>
        <div id="insights" style="display:flex;flex-direction:column;gap:12px">
          <div style="color:var(--text-muted);font-size:13px">Loading insights...</div>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="../js/app.js"></script>
<script>
  if (!Auth.requireAuth()) throw new Error();

  document.getElementById('sidebarMount').innerHTML = getSidebarHTML();
  initSidebar();

  function renderBar(value, max, color, label, unit = '') {
    const pct = max > 0 ? Math.round((value / max) * 100) : 0;
    return `
      <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px">
        <div style="font-size:10px;color:var(--text-muted)">${value}${unit}</div>
        <div style="flex:1;width:100%;display:flex;align-items:flex-end">
          <div style="width:100%;background:${color};border-radius:4px 4px 0 0;height:${pct}%;min-height:${value > 0 ? 4 : 0}px;transition:height 0.5s ease"></div>
        </div>
        <div style="font-size:9px;color:var(--text-muted);text-align:center">${label}</div>
      </div>
    `;
  }

  async function loadAnalytics() {
    try {
      const data = await api('GET', '/analytics');

      // Summary
      document.getElementById('prodScore').textContent = Math.round(data.summary.productivity_score || 0) + '%';
      document.getElementById('totalTasksDone').textContent = data.summary.total_tasks_completed || 0;
      document.getElementById('currentStreak').textContent = `${data.summary.streak_count || 0} 🔥`;

      const totalFocusMins = data.focus_stats.reduce((s, f) => s + (f.minutes || 0), 0);
      document.getElementById('focusHoursTotal').textContent = Math.round(totalFocusMins / 60 * 10) / 10 + 'h';

      // Task completion bars
      const taskContainer = document.getElementById('taskBars');
      const labelContainer = document.getElementById('taskLabels');
      const recent30 = data.task_stats.slice(-14);
      const maxTasks = Math.max(...recent30.map(t => t.total || 0), 1);

      if (recent30.length > 0) {
        taskContainer.innerHTML = recent30.map(t => {
          const d = new Date(t.date + 'T12:00:00');
          const label = d.toLocaleDateString('en-US', { month: 'numeric', day: 'numeric' });
          const completedPct = t.total > 0 ? Math.round((t.completed / t.total) * 100) : 0;
          return `
            <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px">
              <div style="width:100%;display:flex;align-items:flex-end;height:120px">
                <div style="width:100%;background:rgba(245,158,11,0.7);border-radius:3px 3px 0 0;height:${(t.total/maxTasks)*100}%;min-height:${t.total > 0 ? 3 : 0}px;position:relative">
                  <div style="position:absolute;bottom:0;left:0;right:0;background:#10b981;border-radius:3px 3px 0 0;height:${completedPct}%"></div>
                </div>
              </div>
              <div style="font-size:8px;color:var(--text-muted)">${label}</div>
            </div>
          `;
        }).join('');
        document.getElementById('taskChartFallback').style.display = 'block';
      } else {
        document.getElementById('taskChartFallback').innerHTML = `
          <div class="empty-state" style="padding:20px"><div class="empty-state-title">No data yet</div></div>`;
        document.getElementById('taskChartFallback').style.display = 'block';
      }

      // Focus bars
      const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
      const last7 = [];
      for (let i = 6; i >= 0; i--) {
        const d = new Date();
        d.setDate(d.getDate() - i);
        const key = d.toISOString().split('T')[0];
        const found = data.focus_stats.find(f => f.day === key);
        last7.push({ date: d, minutes: found ? found.minutes : 0 });
      }
      const maxFocus = Math.max(...last7.map(f => f.minutes), 60);
      document.getElementById('focusBars').innerHTML = last7.map(f => renderBar(f.minutes, maxFocus, '#3b82f6', days[f.date.getDay()], 'm')).join('');

      // Wake timeline
      const wakeEl = document.getElementById('wakeTimeline');
      if (data.wake_stats.length === 0) {
        wakeEl.innerHTML = `<div class="empty-state" style="padding:16px"><div class="empty-state-title">No wake records yet</div></div>`;
      } else {
        wakeEl.innerHTML = data.wake_stats.slice(-14).reverse().map(w => {
          const d = new Date(w.date + 'T12:00:00').toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
          const icon = w.status === 'on_time' ? '✅' : w.status === 'late' ? '⚠️' : '❌';
          const wakeT = w.wake_time ? dateUtils.formatTime(w.wake_time) : 'Not recorded';
          const color = w.status === 'on_time' ? 'var(--accent3)' : w.status === 'late' ? 'var(--accent)' : 'var(--danger)';
          return `
            <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--surface2);border-radius:8px">
              <div style="display:flex;align-items:center;gap:8px">
                <span>${icon}</span>
                <span style="font-size:13px">${d}</span>
              </div>
              <span style="font-size:13px;font-weight:600;color:${color}">${wakeT}</span>
            </div>
          `;
        }).join('');
      }

      // Insights
      generateInsights(data);

    } catch (err) {
      Toast.error('Failed to load analytics: ' + err.message);
    }
  }

  function generateInsights(data) {
    const insights = [];

    const onTimeWakes = data.wake_stats.filter(w => w.status === 'on_time').length;
    const totalWakes = data.wake_stats.length;
    if (totalWakes > 0) {
      const rate = Math.round((onTimeWakes / totalWakes) * 100);
      insights.push({
        icon: '🌅',
        text: `You wake on time ${rate}% of the time. ${rate >= 80 ? 'Excellent discipline!' : rate >= 50 ? 'Room to improve.' : 'Focus on sleep schedule.'}`,
        color: rate >= 80 ? 'var(--accent3)' : rate >= 50 ? 'var(--accent)' : 'var(--danger)',
      });
    }

    const focusMins = data.focus_stats.reduce((s, f) => s + (f.minutes || 0), 0);
    insights.push({
      icon: '⏱',
      text: `${Math.round(focusMins / 60 * 10) / 10} hours of focused work this week. ${focusMins >= 840 ? 'Amazing! 14h+' : focusMins >= 420 ? 'Good momentum!' : 'Try for more daily focus sessions.'}`,
      color: 'var(--accent2)',
    });

    const completed = data.task_stats.reduce((s, t) => s + (parseInt(t.completed) || 0), 0);
    const total = data.task_stats.reduce((s, t) => s + (parseInt(t.total) || 0), 0);
    if (total > 0) {
      const rate = Math.round((completed / total) * 100);
      insights.push({
        icon: '✅',
        text: `${rate}% task completion rate over 30 days. ${rate >= 80 ? 'You\'re crushing it!' : rate >= 60 ? 'Solid consistency.' : 'Try breaking tasks into smaller steps.'}`,
        color: rate >= 80 ? 'var(--accent3)' : 'var(--accent)',
      });
    }

    const streak = data.summary.streak_count || 0;
    insights.push({
      icon: '🔥',
      text: `Current streak: ${streak} days. ${streak >= 30 ? 'Legendary!' : streak >= 14 ? 'Strong habit forming!' : streak >= 7 ? 'One week in!' : 'Build that streak!'}`,
      color: 'var(--accent)',
    });

    document.getElementById('insights').innerHTML = insights.map(ins => `
      <div style="display:flex;gap:12px;padding:12px;background:var(--surface2);border-radius:10px;border-left:3px solid ${ins.color}">
        <span style="font-size:20px">${ins.icon}</span>
        <span style="font-size:13px;color:var(--text-dim);line-height:1.5">${ins.text}</span>
      </div>
    `).join('');
  }

  loadAnalytics();
</script>
</body>
</html>
